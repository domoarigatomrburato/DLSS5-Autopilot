[project]
name = "dlss5-autopilot"
version = "0.0.0"
requires-python = "==3.12.*"
# The shipped exe is the standard library plus certifi; certifi is pinned for
# the release in the build group and in .github/release-requirements.txt.
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff==0.17.6",
    "basedpyright==1.40.2",
    "vulture==2.16",
    "import-linter==2.17",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "poethepoet==0.49.0",
]
build = [
    "pyinstaller==6.22.3",
    "certifi==2026.11.20",
]

# The only entry points: `uv run poe <task>`; AGENTS.md says when each is needed.
[tool.poe.tasks.fix]
help = "Autofix: ruff check --fix, then ruff format"
sequence = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
]

[tool.poe.tasks.check]
help = "Every read-only check over the whole tree; runs all of them and fails if any did"
ignore_fail = "return_non_zero"
sequence = [
    { cmd = "uv lock --check" },
    { cmd = "ruff format --check" },
    { cmd = "ruff check" },
    { cmd = "basedpyright" },
    { cmd = "vulture" },
    { cmd = "lint-imports" },
]

[tool.poe.tasks.check-files]
help = "Format, lint and type check only the given files (while the tree is not clean yet)"
ignore_fail = "return_non_zero"
args = [{ name = "paths", positional = true, multiple = true, required = true }]
sequence = [
    { cmd = "ruff format --check ${paths}" },
    { cmd = "ruff check ${paths}" },
    { cmd = "basedpyright ${paths}" },
]

[tool.poe.tasks.build]
help = "Build dist/dlss5-autopilot.exe with the release workflow's PyInstaller flags (Windows only)"
cmd = """uv run --group build python -m PyInstaller --onefile --windowed --noupx
    --name dlss5-autopilot --version-file version_info.txt
    --icon dlss5-autopilot.ico --distpath dist --noconfirm dlss5_autopilot.py"""

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The project rule is to comment only a non-obvious why, never to restate the code.
    "D",
    # basedpyright strict covers missing and unknown annotations.
    "ANN",
    # License headers are not used.
    "CPY",
    # Conflicts with the formatter (ruff's formatter docs).
    "COM812",
    # Conflicts with the formatter (ruff's formatter docs).
    "ISC001",
]

[tool.ruff.lint.isort]
# A statement that imports several modules with `as` stays one statement:
# isort's default splits it, and a split turns an import that fails on a
# non-Windows host (core.ui.tray) from "the whole statement fails" into
# "the rest still ran".
combine-as-imports = true

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
pythonPlatform = "Windows"
include = ["."]

[tool.vulture]
paths = ["."]
exclude = [".venv/"]

[tool.importlinter]
root_packages = ["core"]

[[tool.importlinter.contracts]]
name = "core never imports the window outside core.ui"
type = "protected"
protected_modules = ["core.ui"]
allowed_importers = ["core.ui"]

[[tool.importlinter.contracts]]
name = "no import cycles between sibling modules of core"
type = "acyclic_siblings"
ancestors = ["core"]
